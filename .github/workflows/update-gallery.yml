name: Update Gallery Manifest

on:
  push:
    paths:
      - 'images/**'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install Pillow --quiet

      - name: Generate image manifest
        run: |
          python3 << 'EOF'
          import os, json, re
          from PIL import Image, ImageOps

          IMAGE_EXTENSIONS = {'.jpg', '.jpeg', '.png', '.webp'}
          GROUPS = ['latest', 'general', 'music', 'sports']

          def slugify(name):
              return name.lower().replace(' ', '-').replace('_', '-')

          def labelify(slug):
              overrides = {
                  'm2m': 'Metal 2 The Masses -',
                  'ffltech': 'FFLtech',
                  'gv70': 'gv70',
                  'ngpw': 'NGPW',
              }
              words = slug.replace('-', ' ').replace('_', ' ').split()
              result = []
              for word in words:
                  low = word.lower()
                  result.append(overrides[low] if low in overrides else word.capitalize())
              return ' '.join(result)
              
          def extract_keywords(filepath):
              keywords = []
              try:
                  with open(filepath, 'rb') as f:
                      data = f.read()
                  for m in re.finditer(rb'<x:xmpmeta.*?</x:xmpmeta>', data, re.S):
                      xmp = m.group(0).decode('utf-8', errors='ignore')
                      for block in re.findall(r'<dc:subject>.*?</dc:subject>', xmp, re.S):
                          keywords += [s.strip().lower() for s in re.findall(r'<rdf:li[^>]*>([^<]+)</rdf:li>', block) if s.strip()]
              except Exception as e:
                  print(f'  Warning: could not read metadata from {filepath}: {e}')
              return keywords

          THUMB_SHORT_SIDE = 640
          kept_thumbs = set()

          def make_thumb(src):
              # Mirror images/<group>/<category>/<file> into thumbs/, shortest side 640px
              dest = os.path.splitext(os.path.join('thumbs', os.path.relpath(src, 'images')))[0] + '.jpg'
              dest = dest.replace(os.sep, '/')
              kept_thumbs.add(dest)
              if not os.path.exists(dest):
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with Image.open(src) as im:
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      w, h = im.size
                      scale = THUMB_SHORT_SIDE / min(w, h)
                      if scale < 1:
                          im = im.resize((round(w * scale), round(h * scale)), Image.LANCZOS)
                      im.save(dest, 'JPEG', quality=78, optimize=True, progressive=True)
              return dest

          manifest = {'groups': [], 'images': [], 'featured_covers': {}, 'featured_thumbs': {}}
          os.makedirs('thumbs', exist_ok=True)
          images_root = 'images'

          if not os.path.exists(images_root):
              print('No images folder found')
              with open('images.json', 'w') as f:
                  json.dump(manifest, f, indent=2)
              exit()

          featured_count = 0
          total_count = 0

          for group in GROUPS:
              group_path = os.path.join(images_root, group)
              if not os.path.isdir(group_path):
                  continue
              categories = []
              for category in sorted(os.listdir(group_path)):
                  cat_path = os.path.join(group_path, category)
                  if not os.path.isdir(cat_path):
                      continue
                  image_files = [f for f in sorted(os.listdir(cat_path))
                                 if os.path.splitext(f)[1].lower() in IMAGE_EXTENSIONS]
                  if not image_files:
                      continue
                  cat_slug = slugify(category)
                  cat_label = labelify(category)
                  categories.append({'slug': cat_slug, 'label': cat_label})

                  for fname in image_files:
                      fpath = os.path.join(cat_path, fname)
                      keywords = extract_keywords(fpath)
                      featured = 'featured' in keywords

                      if featured:
                          # Store as cover only — excluded from gallery grid
                          manifest['featured_covers'][cat_slug] = f'images/{group}/{category}/{fname}'
                          manifest['featured_thumbs'][cat_slug] = make_thumb(fpath)
                          featured_count += 1
                          print(f'  [FEATURED] {fname}')
                      else:
                          # Normal gallery image
                          title = os.path.splitext(fname)[0].replace('-', ' ').replace('_', ' ').title()
                          manifest['images'].append({
                              'src': f'images/{group}/{category}/{fname}',
                              'thumb': make_thumb(fpath),
                              'title': title,
                              'category': cat_slug,
                              'group': group,
                              'categoryLabel': cat_label,
                          })
                          total_count += 1

              if categories:
                  group_label = 'Latest Work' if group == 'latest' else group.capitalize()
                  manifest['groups'].append({
                      'slug': group,
                      'label': group_label,
                      'categories': categories
                  })

          # Remove thumbnails whose original photo no longer exists
          for root, dirs, files in os.walk('thumbs', topdown=False):
              for name in files:
                  path = os.path.join(root, name).replace(os.sep, '/')
                  if path not in kept_thumbs:
                      os.remove(path)
              if root != 'thumbs' and not os.listdir(root):
                  os.rmdir(root)

          with open('images.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          print(f'Done: {total_count} gallery images, {featured_count} featured covers')
          EOF

      - name: Commit manifest
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A images.json thumbs
          git diff --staged --quiet || git commit -m "Auto-update gallery manifest [skip ci]"
          git push
